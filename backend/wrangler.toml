name = "invoice-extract-proxy"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# Secrets live OUTSIDE this file — never commit real values here:
#
#   Production .. `wrangler secret put <NAME>` (Cloudflare dashboard/secret
#                   store). Secrets override [vars] at runtime, so the worker
#                   reads them from `env` with zero code changes:
#                     Worker env  ->  GEMINI_API_KEY / APP_CLIENT_KEY / ...
#   Development . create `.dev.vars` next to this file (see `.dev.vars.example`);
#                   `wrangler dev` loads it automatically. `.dev.vars` is
#                   git-ignored and must never be committed.
#
# A missing key fails closed: the worker answers 401/503 instead of calling
# any provider, so an unconfigured deploy can never leak or burn quota.
[vars]
# (intentionally empty — all credentials arrive via secrets or .dev.vars)
