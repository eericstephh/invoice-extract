[versions]
agp = "8.7.2"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.27"
room = "2.6.1"

# Compose Multiplatform for the Desktop (JVM) target. The plugin is version-locked to
# the Kotlin version above: 1.7.1 is the release that pairs with Kotlin 2.0.21, so the
# Compose Compiler shipped with the language plugin is used unmodified.
composeMultiplatform = "1.7.1"

androidxCoreKtx = "1.13.1"
androidxLifecycle = "2.8.6"
androidxActivityCompose = "1.9.2"
androidxComposeBom = "2024.09.02"
androidxNavigationCompose = "2.8.1"
androidxExifInterface = "1.3.7"
androidxDataStorePreferences = "1.1.1"
coreSplashscreen = "1.0.1"

koin = "4.0.0"
kotlinxCoroutines = "1.9.0"
kotlinxSerialization = "1.7.3"
okhttp = "4.12.0"

# Apache PDFBox 3.0 for the desktop fast path: text-layer extraction from digital
# PDFs. 3.x moves loading to org.apache.pdfbox.Loader and drops the old static
# PDType1Font constants, so the desktop processor targets this API surface.
pdfbox = "3.0.3"
junit = "4.13.2"

mlkitTextRecognition = "16.0.1"

[libraries]
# Core AndroidX
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCoreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivityCompose" }

# Jetpack Compose (versions provided by the BOM)
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "androidxComposeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-compose-runtime-livedata = { group = "androidx.compose.runtime", name = "runtime-livedata" }

# Navigation Compose
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "androidxNavigationCompose" }

# EXIF metadata reading for image orientation correction
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "androidxExifInterface" }

# Preferences DataStore. Phase 12.1 persists the user session here: a guest UUID and the
# signed-in profile. Typed DataStore would need a Kotlinx-serializable schema plus
# generated adapters; the session is a handful of flat keys, so the Preferences variant
# keeps the layer dependency-free and the corrupt-state recovery story simple.
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "androidxDataStorePreferences" }

# AndroidX Core Splashscreen (Phase 18). Android 12+ system splash with a graceful
# pre-12 fallback baked into the library.
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }

# Koin - lightweight dependency injection (no annotation processing / KSP)
# Core artifact for the JVM-only desktop module; the Android app takes the android
# and compose variants below.
koin-core = { group = "io.insert-koin", name = "koin-core", version.ref = "koin" }
koin-android = { group = "io.insert-koin", name = "koin-android", version.ref = "koin" }
koin-androidx-compose = { group = "io.insert-koin", name = "koin-androidx-compose", version.ref = "koin" }

# Apache PDFBox: digital-PDF text extraction on the desktop fast path. Runtime only —
# the text stripper and the Loader entry point are all the pipeline needs.
pdfbox = { group = "org.apache.pdfbox", name = "pdfbox", version.ref = "pdfbox" }

# ML Kit on-device text recognition. The recognizer and its bundled model ship inside
# the AAR, so recognition works fully offline. NOTE: ML Kit has no Arabic/Persian
# recognizer — only Latin, Chinese, Devanagari, Japanese and Korean — so this is the
# Latin recognizer for now; Persian OCR needs a different engine.
mlkit-text-recognition = { group = "com.google.mlkit", name = "text-recognition", version.ref = "mlkitTextRecognition" }

# Room SQLite persistence (Phase 8.1). Runtime + KTX on the app classpath,
# compiler on the KSP processor path only.
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# Pure-Kotlin coroutines. The :domain module needs core for Flow in the
# repository contract; :app gets it transitively via lifecycle/room but the
# explicit version pin keeps both modules on one version.
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }

# JSON (de)serialization for the network DTOs. Robust by default: unknown keys
# are ignored and null inputs are coerced, so a worker schema update can never
# crash the client mid-parse.
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# OkHttp. Chosen over HttpURLConnection for real connect/read timeouts, a
# connection pool, and cancelable calls that unblock on coroutine cancellation.
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }

# Local modules
invoiceextract-domain = { group = "com.invoiceextract", name = "domain", version = "0.1.0" }

# Test
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# Kotlin 2.0+ ships the Compose Compiler as a first-party Gradle plugin,
# replacing the old `androidx.compose.compiler:compiler` dependency.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# KSP for Room codegen. Version tracks the Kotlin version (2.0.21-1.0.27).
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
# Kotlinx Serialization compiler plugin, paired with Kotlin 2.0.21.
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# Compose Multiplatform. On the :desktop module it wires the Compose Compiler for
# Kotlin 2.0.21 and provides the `compose` dependency accessors (material3,
# desktop.currentOs, ...) plus the native-distribution DSL.
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
