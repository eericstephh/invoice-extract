# JVM configuration for the Gradle daemon
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# Run independent projects in parallel and reuse outputs from previous builds.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX is mandatory since AGP 8.x; non-transitive R classes keep the
# resource table small and build times low.
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin code style for the whole monorepo.
kotlin.code.style=official

# Compose Desktop forks `jpackage` as an external tool to build the .exe/.msi
# installers. jpackage decodes its `@argfile` with the JVM default charset, which is
# Cp1252 on a Western Windows locale; the argfile itself is UTF-8, so any non-ASCII
# nativeDistributions field (the Persian description, the (c) in the copyright) makes
# the decoder throw MalformedInputException and the packaging tasks fail with the
# opaque "Input length = 1". JAVA_TOOL_OPTIONS is inherited by every JVM the build
# forks, so this makes jpackage read its own argfile as UTF-8. Harmless on a host that
# is already UTF-8.
JAVA_TOOL_OPTIONS=-Dfile.encoding=UTF-8
